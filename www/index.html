<!DOCTYPE html>
<html lang="uk" class="dark"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URLHub — Органайзер посилань</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (typeof tailwind !== 'undefined') {
            tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        colors: {
                            darkbg: '#080a0e',
                            cardbg: '#12161f',
                            bordercol: '#262d3d',
                            crimson: '#b91c1c',
                            crimsonglow: '#dc2626'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #080a0e;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 28px 28px;
            color: #cbd5e1;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
        }
        .hidden { display: none !important; }
        .flex { display: flex; }
        button { cursor: pointer; }

        /* Контурний стиль карток як на фото */
        .cyber-card {
            background-color: #12161f;
            border: 1.5px solid #262d3d;
            border-radius: 16px;
            transition: all 0.25s ease;
        }
        .cyber-card:hover {
            border-color: #b91c1c;
            box-shadow: 0 0 16px rgba(185, 28, 28, 0.28), inset 0 0 8px rgba(185, 28, 28, 0.08);
            transform: translateY(-2px);
        }
        .cyber-icon-box {
            background-color: #161b26;
            border: 1.5px solid #2a3241;
            border-radius: 14px;
            transition: all 0.25s ease;
        }
        .cyber-card:hover .cyber-icon-box,
        .icon-option.selected {
            border-color: #dc2626;
            box-shadow: 0 0 12px rgba(220, 38, 38, 0.35);
            background-color: #1c161b;
        }
        .cyber-btn-red {
            background-color: rgba(153, 27, 27, 0.2);
            border: 1.5px solid #991b1b;
            color: #f87171;
            transition: all 0.25s ease;
        }
        .cyber-btn-red:hover {
            background-color: rgba(185, 28, 28, 0.35);
            border-color: #dc2626;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.3);
            color: #ffffff;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #080a0e; }
        ::-webkit-scrollbar-thumb { background: #262d3d; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #991b1b; }
    </style>

<body class="min-h-screen flex flex-col selection:bg-red-900 selection:text-white">

    <!-- ПРИВІТАЛЬНИЙ ЕКРАН (SPLASH SCREEN З PLEXUS-АНІМАЦІЄЮ) -->
    <div id="welcomeScreen" class="fixed inset-0 z-50 bg-black flex flex-col items-center justify-center transition-opacity duration-500">
        <canvas id="plexusCanvas" class="absolute inset-0 w-full h-full pointer-events-none" width="411" height="785"></canvas>
        
        <div class="relative z-10 flex flex-col items-center text-center px-4">
            <div class="mb-6 p-4 rounded-2xl bg-zinc-950/80 border border-red-900/50 shadow-[0_0_30px_rgba(185,28,28,0.2)]">
                <svg class="w-14 h-14 text-red-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"></path>
                    <rect x="9" y="10" width="6" height="5" rx="1"></rect>
                    <path d="M10 10V8a2 2 0 114 0v2"></path>
                </svg>
            </div>
            <p class="text-xs uppercase tracking-[0.35em] text-zinc-500 mb-4">Personal Tactical Link Directory</p>
            <button type="button" onclick="enterHub()" class="group relative px-12 py-4 rounded-xl bg-zinc-950/90 border border-red-800/80 hover:border-red-500 text-2xl font-bold tracking-wider text-zinc-200 hover:text-white shadow-[0_0_25px_rgba(185,28,28,0.25)] hover:shadow-[0_0_40px_rgba(220,38,38,0.5)] transition-all duration-300">
                <span class="bg-gradient-to-r from-zinc-100 via-red-200 to-red-500 bg-clip-text text-transparent">URLHub</span>
                <span class="block text-[10px] font-normal tracking-[0.25em] text-red-500/80 group-hover:text-red-400 mt-1 uppercase">Увійти в систему ➔</span>
            </button>
        </div>
    </div>

    <!-- ВЕРХНЯ ПАНЕЛЬ (HEADER) -->
    <header class="sticky top-0 z-30 bg-[#0b0e14]/95 backdrop-blur-md border-b border-[#1e2430] px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <button type="button" onclick="showWelcome()" title="На головний екран" class="flex items-center gap-2.5 group text-left">
                    <div class="w-9 h-9 rounded-lg bg-[#141821] border border-red-900/60 group-hover:border-red-500 flex items-center justify-center transition">
                        <span class="w-2.5 h-2.5 rounded-full bg-red-600 shadow-[0_0_8px_#ef4444]"></span>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold tracking-wider text-zinc-100 group-hover:text-red-400 transition">
                            URL<span class="text-red-600">Hub</span>
                        </h1>
                    </div>
                </button>
                <span id="unsavedBadge" class="text-[11px] bg-red-950/80 text-red-300 border border-red-800/60 px-2.5 py-0.5 rounded-full hidden">
                    ● Не збережено у файл
                </span>
            </div>

            <!-- Пошук -->
            <div class="flex-1 max-w-md mx-auto w-full order-3 lg:order-2">
                <div class="relative">
                    <input type="text" id="searchInput" oninput="renderBookmarks()" placeholder="Пошук ресурсу, опису або URL..." class="w-full bg-[#12161f] border border-[#262d3d] rounded-lg pl-9 pr-4 py-1.5 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-red-700 transition">
                    <svg class="w-4 h-4 text-zinc-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path>
                    </svg>
                </div>
            </div>

            <!-- Кнопки управління -->
            <div class="flex items-center gap-2 order-2 lg:order-3">
                <button type="button" onclick="saveSelfContainedHTML()" title="Завантажити оновлений файл URLHub.html" class="cyber-btn-red px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
                    <span>💾</span> <span>Зберегти HTML</span>
                </button>
                <button type="button" onclick="toggleView()" id="viewToggleBtn" title="Змінити вигляд (Плитка / Детально)" class="px-2.5 py-1.5 bg-[#12161f] hover:bg-[#1a202c] border border-[#262d3d] hover:border-red-800/60 rounded-lg text-xs text-zinc-300 transition">
                    🔳 Плитка
                </button>
                <button type="button" onclick="exportJSON()" title="Експорт бази в JSON" class="px-2.5 py-1.5 bg-[#12161f] hover:bg-[#1a202c] border border-[#262d3d] hover:border-red-800/60 rounded-lg text-xs text-zinc-300 transition">
                    ⬇️ JSON
                </button>
                <label title="Імпорт бази з JSON" class="px-2.5 py-1.5 bg-[#12161f] hover:bg-[#1a202c] border border-[#262d3d] hover:border-red-800/60 rounded-lg text-xs text-zinc-300 cursor-pointer transition">
                    ⬆️ Імпорт
                    <input type="file" id="importFile" accept=".json" onchange="importJSON(event)" class="hidden">
                </label>
            </div>
        </div>

        <!-- Фільтр категорій -->
        <div class="max-w-7xl mx-auto mt-3 flex items-center gap-2 overflow-x-auto pb-1" id="categoryFilter"></div>
    </header>

    <!-- ОСНОВНИЙ КОНТЕНТ -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
        <div id="bookmarksContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

        <!-- Пустий стан -->
        <div id="emptyState" class="text-center py-20">
            <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-[#12161f] border border-[#262d3d] flex items-center justify-center text-zinc-500">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9"></circle><path d="M12 12L16.5 7.5"></path><circle cx="12" cy="12" r="4"></circle>
                </svg>
            </div>
            <h2 class="text-base font-medium text-zinc-300">Вузлів не знайдено</h2>
            <p class="text-xs text-zinc-500 mt-1">Додайте нову закладку кнопкою «+» або змініть фільтр</p>
        </div>
    </main>

    <!-- ПЛАВАЮЧА КНОПКА (+) -->
    <button type="button" onclick="openModal()" title="Додати нову закладку" class="fixed bottom-6 right-6 w-14 h-14 rounded-2xl bg-[#141821] hover:bg-red-950 border-2 border-red-800 hover:border-red-500 text-red-400 hover:text-white shadow-[0_0_20px_rgba(185,28,28,0.35)] flex items-center justify-center text-3xl font-light transition transform hover:scale-105 z-40">
        +
    </button>

    <!-- МОДАЛЬНЕ ВІКНО ДОДАВАННЯ / РЕДАГУВАННЯ -->
    <div id="formModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-[#10141d] border border-[#2a3241] rounded-2xl max-w-lg w-full p-5 shadow-2xl max-h-[92vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-[#1e2430]">
                <h3 id="modalTitle" class="text-base font-semibold text-zinc-100">Новий вузол URLHub</h3>
                <button type="button" onclick="closeModal()" class="text-zinc-500 hover:text-red-400 text-2xl leading-none">×</button>
            </div>

            <form id="bookmarkForm" onsubmit="saveBookmark(event)" class="space-y-4">
                <input type="hidden" id="bookmarkId">
                <input type="hidden" id="bmIcon" value="shield-lock">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Назва *</label>
                        <input type="text" id="bmTitle" required="" placeholder="Напр: OSINT Framework" class="w-full bg-[#080a0e] border border-[#262d3d] rounded-lg px-3 py-2 text-sm text-zinc-100 focus:outline-none focus:border-red-700">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">Категорія *</label>
                        <input type="text" id="bmCategory" list="categoryList" required="" placeholder="OSINT, Мережі, Інструменти..." class="w-full bg-[#080a0e] border border-[#262d3d] rounded-lg px-3 py-2 text-sm text-zinc-100 focus:outline-none focus:border-red-700">
                        <datalist id="categoryList"></datalist>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-zinc-400 mb-1">URL-адреса *</label>
                    <input type="url" id="bmUrl" required="" placeholder="https://..." class="w-full bg-[#080a0e] border border-[#262d3d] rounded-lg px-3 py-2 text-sm text-zinc-100 focus:outline-none focus:border-red-700">
                </div>

            'cloud-lock': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 18a4 4 0 01-.4-7.98 5.5 5.5 0 0110.8-1A3.5 3.5 0 0117 16"/><rect x="9" y="14" width="6" height="5" rx="1"/><path d="M10.5 14v-1.5a1.5 1.5 0 013 0V14"/></svg>`,

        // Вбудована база даних (автоматично перезаписується при натисканні "Зберегти HTML")
        /*__BOOKMARKS_START__*/
        const EMBEDDED_DATA = [];
        /*__BOOKMARKS_END__*/

        let bookmarks = [];
        let currentCategory = 'Всі';
        let isTileMode = false; // Перемикач: Картки з описом або Чиста плитка іконок як на 245.jpg
        let plexusAnimId = null;

        function safeGetStorage() {
            try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
        }
        function safeSetStorage(val) {
            try { localStorage.setItem(STORAGE_KEY, val); } catch (e) {}
        }

        function getIconSVG(key, sizeClass = "w-7 h-7") {
            const raw = CYBER_ICONS[key] || CYBER_ICONS['shield-lock'];
            return raw.replace('<svg ', `<svg class="${sizeClass} text-slate-300 group-hover:text-red-400 transition-colors" `);
        }

        // --- АНІМАЦІЯ PLEXUS (ЯК НА 246.GIF) ---
        function startPlexusAnimation() {
            const canvas = document.getElementById('plexusCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let w = canvas.width = window.innerWidth;
            let h = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            });

            const nodes = [];
            const count = 65;
            for (let i = 0; i < count; i++) {
                // Щільне ядро в центрі + розріджені гілки навколо
                const isCore = i < 28;
                const radius = isCore ? Math.random() * 95 : 95 + Math.random() * 190;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                nodes.push({
                    x: radius * Math.sin(phi) * Math.cos(theta),
                    y: radius * Math.sin(phi) * Math.sin(theta),
                    z: radius * Math.cos(phi),
                    vx: (Math.random() - 0.5) * 0.35,
                    vy: (Math.random() - 0.5) * 0.35,
                    vz: (Math.random() - 0.5) * 0.35,
                    isCore
                });
            }

            let angleY = 0;
            let angleX = 0;

            function animate() {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, w, h);

                angleY += 0.004;
                angleX += 0.002;
                const cosY = Math.cos(angleY), sinY = Math.sin(angleY);
                const cosX = Math.cos(angleX), sinX = Math.sin(angleX);

                // Фонове червоне світіння ядра
                const grad = ctx.createRadialGradient(w / 2, h / 2, 5, w / 2, h / 2, 180);
                grad.addColorStop(0, 'rgba(220, 20, 20, 0.22)');
                grad.addColorStop(0.5, 'rgba(140, 10, 10, 0.06)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                const projected = nodes.map(n => {
                    n.x += n.vx; n.y += n.vy; n.z += n.vz;
                    const maxR = n.isCore ? 100 : 280;
                    const dist = Math.hypot(n.x, n.y, n.z);
                    if (dist > maxR) { n.vx *= -1; n.vy *= -1; n.vz *= -1; }

                    let x1 = n.x * cosY - n.z * sinY;
                    let z1 = n.z * cosY + n.x * sinY;
                    let y1 = n.y * cosX - z1 * sinX;
                    let z2 = z1 * cosX + n.y * sinX;

                    const scale = 420 / (420 + z2);
                    return {
                        px: w / 2 + x1 * scale,
                        py: h / 2 + y1 * scale,
                        z: z2,
                        isCore: n.isCore
                    };
                });

                // Малюємо з'єднання
                for (let i = 0; i < projected.length; i++) {
                    for (let j = i + 1; j < projected.length; j++) {
                        const dx = projected[i].px - projected[j].px;
                        const dy = projected[i].py - projected[j].py;
                        const d = Math.hypot(dx, dy);
                        const maxDist = (projected[i].isCore && projected[j].isCore) ? 95 : 125;

                        if (d < maxDist) {
                            const alpha = (1 - d / maxDist) * (projected[i].isCore ? 0.85 : 0.45);
                            ctx.strokeStyle = `rgba(225, 25, 25, ${alpha})`;
                            ctx.lineWidth = projected[i].isCore ? 1.2 : 0.7;
                            ctx.beginPath();
                            ctx.moveTo(projected[i].px, projected[i].py);
                            ctx.lineTo(projected[j].px, projected[j].py);
                            ctx.stroke();
                        }
                    }
                }

                // Малюємо вузли
                projected.forEach(p => {
                    ctx.fillStyle = p.isCore ? '#ff2a2a' : '#b91c1c';
                    ctx.beginPath();
                    ctx.arc(p.px, p.py, p.isCore ? 2.2 : 1.5, 0, Math.PI * 2);
                    ctx.fill();

                    if (Math.random() > 0.7) {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(p.px - 0.5, p.py - 0.5, 1.2, 1.2);
                    }
                });

                plexusAnimId = requestAnimationFrame(animate);
            }
            animate();
        }

        function enterHub() {
            const ws = document.getElementById('welcomeScreen');
            ws.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                ws.classList.add('hidden');
                if (plexusAnimId) cancelAnimationFrame(plexusAnimId);
            }, 450);
        }

        function showWelcome() {
            const ws = document.getElementById('welcomeScreen');
            ws.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
            startPlexusAnimation();
        }

        // --- ОСНОВНА ЛОГІКА ДОДАТКУ ---
        function initApp() {
            loadData();
            initIconPicker();
            renderCategories();
            renderBookmarks();
            startPlexusAnimation();
        }

        function initIconPicker() {
            const container = document.getElementById('iconPicker');
            const selectedKey = document.getElementById('bmIcon').value || 'shield-lock';
            container.innerHTML = Object.keys(CYBER_ICONS).map(key => `
                <button type="button" onclick="selectIcon('${key}')" data-icon="${key}"
                    class="icon-option cyber-icon-box p-2.5 flex items-center justify-center hover:border-red-600 ${key === selectedKey ? 'selected' : ''}">
                    ${getIconSVG(key, 'w-7 h-7')}
                </button>
            `).join('');
        }

        function selectIcon(key) {
            document.getElementById('bmIcon').value = key;
            document.querySelectorAll('.icon-option').forEach(btn => {
                btn.classList.toggle('selected', btn.getAttribute('data-icon') === key);
            });
        }

        function loadData() {
            const saved = safeGetStorage();
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) bookmarks = parsed;
                } catch (e) { bookmarks = []; }
            }
            if (!bookmarks || bookmarks.length === 0) {
                bookmarks = JSON.parse(JSON.stringify(EMBEDDED_DATA));
                safeSetStorage(JSON.stringify(bookmarks));
            }
        }

        function saveData(markDirty = true) {
            safeSetStorage(JSON.stringify(bookmarks));
            if (markDirty) {
                document.getElementById('unsavedBadge').classList.remove('hidden');
            }
            renderCategories();
            renderBookmarks();
        }

        function renderCategories() {
            const categories = ['Всі', ...new Set(bookmarks.map(b => (b.category || '').trim()).filter(Boolean))];
            const filterContainer = document.getElementById('categoryFilter');
            filterContainer.innerHTML = categories.map(cat => {
                const active = cat === currentCategory 
                    ? 'bg-red-900/40 text-red-200 border border-red-600 shadow-[0_0_10px_rgba(220,38,38,0.25)] font-medium' 
                    : 'bg-[#12161f] text-zinc-400 hover:text-zinc-200 border border-[#262d3d] hover:border-red-900/60';
                return `<button type="button" onclick="setCategory('${escapeHTML(cat)}')" class="px-3.5 py-1 rounded-lg text-xs whitespace-nowrap transition ${active}">${escapeHTML(cat)}</button>`;
            }).join('');

            const datalist = document.getElementById('categoryList');
            datalist.innerHTML = categories.filter(c => c !== 'Всі').map(c => `<option value="${escapeHTML(c)}">`).join('');
        }

        function setCategory(cat) {
            currentCategory = cat;
            renderCategories();
            renderBookmarks();
        }

        function toggleView() {
            isTileMode = !isTileMode;
            const btn = document.getElementById('viewToggleBtn');
            const container = document.getElementById('bookmarksContainer');
            if (isTileMode) {
                btn.innerHTML = '📋 Картки';
                container.className = 'grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-4';
            } else {
                btn.innerHTML = '🔳 Плитка';
                container.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4';
            }
            renderBookmarks();
        }

        function renderBookmarks() {
            const container = document.getElementById('bookmarksContainer');
            const emptyState = document.getElementById('emptyState');
            const query = (document.getElementById('searchInput').value || '').toLowerCase();

            const filtered = bookmarks.filter(b => {
                const matchesCat = currentCategory === 'Всі' || b.category === currentCategory;
                const matchesQuery = (b.title || '').toLowerCase().includes(query) || 
                                     (b.desc || '').toLowerCase().includes(query) || 
                                     (b.url || '').toLowerCase().includes(query);
                return matchesCat && matchesQuery;
            });

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            // Компактний режим іконок як на 245.jpg
            if (isTileMode) {
                container.innerHTML = filtered.map(b => `
                    <div class="cyber-card p-4 flex flex-col items-center text-center justify-between group relative">
                        <div class="absolute top-2 right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition">
                            <button type="button" onclick="editBookmark('${b.id}')" class="p-1 text-xs bg-[#0b0e14] rounded border border-[#262d3d] hover:border-red-600">✏️</button>
                            <button type="button" onclick="deleteBookmark('${b.id}')" class="p-1 text-xs bg-[#0b0e14] rounded border border-[#262d3d] hover:border-red-600">🗑️</button>
                        </div>
                        <a href="${escapeHTML(b.url)}" target="_blank" rel="noopener noreferrer" class="flex flex-col items-center w-full py-2">
                            <div class="cyber-icon-box w-20 h-20 flex items-center justify-center mb-3">
                                ${getIconSVG(b.icon, 'w-11 h-11')}
                            </div>
                            <span class="font-semibold text-sm text-zinc-200 group-hover:text-red-400 transition truncate w-full">${escapeHTML(b.title)}</span>
                            <span class="text-[10px] text-zinc-500 mt-0.5">${escapeHTML(b.category)}</span>
                        </a>
                    </div>
                `).join('');
                return;
            }

            // Повний режим карток з описом
            container.innerHTML = filtered.map(b => `
                <div class="cyber-card p-4 flex flex-col justify-between group">
                    <div>
                        <div class="flex items-start justify-between gap-3 mb-2.5">
                            <div class="flex items-center gap-3 min-w-0">
                                <div class="cyber-icon-box w-14 h-14 flex items-center justify-center shrink-0">
                                    ${getIconSVG(b.icon, 'w-8 h-8')}
                                </div>
                                <div class="truncate">
                                    <a href="${escapeHTML(b.url)}" target="_blank" rel="noopener noreferrer" 
                                        class="font-semibold text-zinc-100 group-hover:text-red-400 transition truncate block">
                                        ${escapeHTML(b.title)}
                                    </a>
                                    <span class="text-xs text-zinc-500 truncate block">${escapeHTML(b.url)}</span>
                                </div>
                            </div>
                            <span class="text-[10px] bg-[#161b26] text-red-400/90 px-2 py-0.5 rounded border border-red-900/40 shrink-0">
                                ${escapeHTML(b.category)}
                            </span>
                        </div>
                        <p class="text-xs text-zinc-400 line-clamp-2 mt-2 mb-4">${escapeHTML(b.desc || 'Без опису')}</p>
                    </div>

                    <div class="flex items-center justify-between pt-3 border-t border-[#1e2430] text-xs">
                        <div class="flex items-center gap-2">
                            <a href="${escapeHTML(b.url)}" target="_blank" rel="noopener noreferrer" 
                                class="text-red-400 hover:text-red-300 font-medium flex items-center gap-1">
                                Відкрити ↗
                            </a>
                            <button type="button" onclick="openWebview('${escapeHTML(b.url)}', '${escapeHTML(b.title)}')" 
                                class="text-zinc-400 hover:text-zinc-200 px-2 py-0.5 rounded bg-[#0b0e14] border border-[#262d3d] hover:border-red-900">
                                👁️ WebView
                            </button>
                        </div>
                        <div class="flex items-center gap-1">
                            <button type="button" onclick="editBookmark('${b.id}')" title="Редагувати" class="p-1 hover:bg-zinc-800 rounded">✏️</button>
                            <button type="button" onclick="deleteBookmark('${b.id}')" title="Видалити" class="p-1 hover:bg-red-950/60 text-red-400 rounded">🗑️</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function openModal(editId = null) {
            const modal = document.getElementById('formModal');
            const form = document.getElementById('bookmarkForm');
            form.reset();

            if (editId) {
                const bm = bookmarks.find(b => b.id === editId);
                if (bm) {
                    document.getElementById('modalTitle').textContent = 'Редагувати вузол';
                    document.getElementById('bookmarkId').value = bm.id;
                    document.getElementById('bmUrl').value = bm.url;
                    document.getElementById('bmTitle').value = bm.title;
                    document.getElementById('bmIcon').value = CYBER_ICONS[bm.icon] ? bm.icon : 'shield-lock';
                    document.getElementById('bmCategory').value = bm.category;
                    document.getElementById('bmDesc').value = bm.desc;
                }
            } else {
                document.getElementById('modalTitle').textContent = 'Новий вузол URLHub';
                document.getElementById('bookmarkId').value = '';
                document.getElementById('bmIcon').value = 'shield-lock';
                if (currentCategory !== 'Всі') {
                    document.getElementById('bmCategory').value = currentCategory;
                }
            }

            initIconPicker();
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('formModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function saveBookmark(e) {
            e.preventDefault();
            const id = document.getElementById('bookmarkId').value;
            const newBm = {
                id: id || Date.now().toString(),
                url: document.getElementById('bmUrl').value.trim(),
                title: document.getElementById('bmTitle').value.trim(),
                icon: document.getElementById('bmIcon').value.trim() || 'shield-lock',
                category: document.getElementById('bmCategory').value.trim(),
                desc: document.getElementById('bmDesc').value.trim()
            };

            if (id) {
                const idx = bookmarks.findIndex(b => b.id === id);
                if (idx > -1) bookmarks[idx] = newBm;
            } else {
                bookmarks.unshift(newBm);
            }

            saveData(true);
            closeModal();
        }

        function editBookmark(id) { openModal(id); }

        function deleteBookmark(id) {
            if (confirm('Видалити цей вузол із бази URLHub?')) {
                bookmarks = bookmarks.filter(b => b.id !== id);
                saveData(true);
            }
        }

        function openWebview(url, title) {
            const modal = document.getElementById('webviewModal');
            document.getElementById('wvTitle').textContent = title;
            document.getElementById('wvExternalLink').href = url;
            document.getElementById('wvFrame').src = url;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeWebview() {
            const modal = document.getElementById('webviewModal');
            document.getElementById('wvFrame').src = 'about:blank';
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // --- ЗБЕРЕЖЕННЯ ОНОВЛЕНОГО HTML ТА JSON ---
        async function saveSelfContainedHTML() {
            const ws = document.getElementById('welcomeScreen');
            const wasHidden = ws.classList.contains('hidden');

            // Готуємо чистий стан перед знімком DOM
            ws.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
            document.getElementById('bookmarksContainer').innerHTML = '';
            document.getElementById('categoryFilter').innerHTML = '';
            document.getElementById('iconPicker').innerHTML = '';
            document.getElementById('unsavedBadge').classList.add('hidden');

            let htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

            // Повертаємо поточний інтерфейс
            if (wasHidden) ws.classList.add('hidden', 'opacity-0', 'pointer-events-none');
            initIconPicker();
            renderCategories();
            renderBookmarks();

            const dataString = JSON.stringify(bookmarks, null, 4);
            const replacement = `/*__BOOKMARKS_START__*/\n        const EMBEDDED_DATA = ${dataString};\n        /*__BOOKMARKS_END__*/`;
            htmlContent = htmlContent.replace(/\/\*__BOOKMARKS_START__\*\/[\s\S]*?\/\*__BOOKMARKS_END__\*\//, replacement);

            safeSetStorage(JSON.stringify(bookmarks));

            if (window.showSaveFilePicker) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: 'URLHub.html',
                        types: [{ description: 'URLHub Application', accept: { 'text/html': ['.html'] } }]
                    });
                    const writable = await handle.createWritable();
                    await writable.write(htmlContent);
                    await writable.close();
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                }
            }

            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'URLHub.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function exportJSON() {
            const dataStr = JSON.stringify(bookmarks, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const date = new Date().toISOString().slice(0, 10);
            const a = document.createElement('a');
            a.href = url;
            a.download = `urlhub_backup_${date}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        if (confirm(`Знайдено записів: ${imported.length}. Замінити поточну базу (ОК) чи об'єднати (Скасувати)?`)) {
                            bookmarks = imported;
                        } else {
                            const existingIds = new Set(bookmarks.map(b => b.id));
                            imported.forEach(item => {
                                if (!existingIds.has(item.id)) bookmarks.push(item);
                            });
                        }
                        saveData(true);
                        alert('Базу URLHub оновлено! Натисніть "💾 Зберегти HTML", щоб зафіксувати її у файлі.');
                    }
                } catch (err) {
                    alert('Помилка читання JSON-файлу.');
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        function escapeHTML(str) {
            return String(str || '').replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        initApp();
    </script>

</body></html>
